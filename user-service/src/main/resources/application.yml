server:
  port: 8082

spring:
  application:
    name: user-service
  data:
    redis:
      host: ${USER_REDIS_HOST}
      port: ${USER_REDIS_PORT}

  datasource:
    url: ${USER_DATABASE_URL}
    username: ${USER_DATABASE_ID}
    password: ${USER_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DISCOVERY_URL}
    register-with-eureka: true
    fetch-registry: true

jwt:
  issuer: ${JWT_ISSUER}
  secret: ${JWT_SECRET}

