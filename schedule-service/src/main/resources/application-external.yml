eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:${EUREKA_PORT}/eureka/
  instance:
    hostname: localhost    # 추가: 호스트명 명시적 설정
    preferIpAddress: true
    instanceId: ${spring.application.name}:${server.port}  # 추가: 인스턴스 ID 설정


