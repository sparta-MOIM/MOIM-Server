server:
  port: 19091

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DISCOVERY_URL}
    register-with-eureka: true
    fetch-registry: true

spring:
  main:
    web-application-type: reactive
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - JwtAuthenticationFilter

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/logout
          filters:
            - JwtAuthenticationFilter

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comment/**
          filters:
            - JwtAuthenticationFilter

        - id: organization-service
          uri: lb://organization-service
          predicates:
            - Path=/api/v1/organizations/**
          filters:
            - JwtAuthenticationFilter

        - id: gathering-service
          uri: lb://gathering-service
          predicates:
            - Path=/api/v1/gathering/**
          filters:
            - JwtAuthenticationFilter

        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/api/v1/schedules/**
          filters:
            - JwtAuthenticationFilter

        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat/**, /api/v1/chat_room/**
          filters:
            - JwtAuthenticationFilter

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - JwtAuthenticationFilter

        - id: session-service
          uri: lb://session-service
          predicates:
            - Path=/api/v1/session/**
          filters:
            - JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET}
