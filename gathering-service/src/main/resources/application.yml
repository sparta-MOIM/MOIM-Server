spring:
  application:
    name: gathering-service

  datasource:
    url: ${GATHERING_DATABASE_URL:jdbc:mysql://localhost:3311/gathering_db}
    username: ${GATHERING_DATABASE_ID:root}
    password: ${GATHERING_DATABASE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  data:
    redis:
      stream-join-key: stream:gathering_join
      stream-leave-key: stream:gathering_leave
      group-join-name: gathering_join_group
      group-leave-name: gathering_leave_group
      consumer-id: gathering_consumer_
      poll-timeout: 1
      host: ${GATHERING_REDIS_HOST:localhost}
      port: ${GATHERING_REDIS_PORT:6379}
      username: ${GATHERING_REDIS_USERNAME}
      password: ${GATHERING_REDIS_PASSWORD}
      timeout: 6000
      database: 0
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:19090/eureka/}


server:
  port: 8085

springdoc:
  swagger-ui:
    enabled: true
    path: /docs
    url: /springdoc/openapi3-gathering-service.json
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: /api-docs-gathering-service
