server:
  port: 8084
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: organization-service

  datasource:
    url: ${ORGANIZATION_DB_URL}
    username: ${ORGANIZATION_DB_USERNAME}
    password: ${ORGANIZATION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true

management:
  #  server:
  #    port: 10100
  endpoints:
    web:
      exposure:
        include: prometheus, metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    prometheus:
      access: unrestricted